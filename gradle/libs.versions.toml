[versions]
agp                 = "8.7.3"
kotlin              = "2.1.0"
coreKtx             = "1.15.0"
fragment            = "1.8.5"
appcompat           = "1.7.0"
material            = "1.12.0"
composeBom          = "2025.05.00"
activityCompose     = "1.10.1"
timber              = "5.0.1"
seismic             = "1.0.3"
chucker             = "4.1.0"
okhttp              = "4.12.0"

[libraries]
# AndroidX
androidx-core-ktx          = { group = "androidx.core",           name = "core-ktx",          version.ref = "coreKtx" }
androidx-fragment-ktx       = { group = "androidx.fragment",       name = "fragment-ktx",      version.ref = "fragment" }
androidx-appcompat         = { group = "androidx.appcompat",      name = "appcompat",         version.ref = "appcompat" }
material                   = { group = "com.google.android.material", name = "material",       version.ref = "material" }

# Compose
compose-bom                = { group = "androidx.compose",        name = "compose-bom",       version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling         = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
activity-compose           = { group = "androidx.activity",       name = "activity-compose",  version.ref = "activityCompose" }

# Logger
timber                     = { group = "com.jakewharton.timber",  name = "timber",            version.ref = "timber" }

# Shake
seismic                    = { group = "com.squareup",            name = "seismic",           version.ref = "seismic" }

# Network
chucker                    = { group = "com.github.chuckerteam.chucker", name = "library",    version.ref = "chucker" }
chucker-no-op              = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }
okhttp                     = { group = "com.squareup.okhttp3",    name = "okhttp",            version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
